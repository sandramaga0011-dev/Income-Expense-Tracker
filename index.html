<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<title>Income and Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar, cards by role. */
:root{
  --bg:#f1f5f4; --surface:#ffffff; --ink:#12302f; --muted:#5a7271; --line:#d8e2e0;
  --accent:#0f6b63; --accent-ink:#ffffff; --accent-soft:#dff0ed;
  --inc:#1b7f4b; --exp:#c2410c; --sav:#2b5fc4;
  --good:#1b7f4b; --bad:#b42318; --good-bg:#e2f4ea; --bad-bg:#fde8e6;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a19; --surface:#132826; --ink:#e4f1ef; --muted:#93b0ad; --line:#26413e;
  --accent:#4cc2b3; --accent-ink:#06211e; --accent-soft:#17403b;
  --inc:#52c98a; --exp:#ff9468; --sav:#8fb0ff;
  --good:#52c98a; --bad:#ff8a7d; --good-bg:#123a28; --bad-bg:#43211e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1a19; --surface:#132826; --ink:#e4f1ef; --muted:#93b0ad; --line:#26413e;
  --accent:#4cc2b3; --accent-ink:#06211e; --accent-soft:#17403b;
  --inc:#52c98a; --exp:#ff9468; --sav:#8fb0ff;
  --good:#52c98a; --bad:#ff8a7d; --good-bg:#123a28; --bad-bg:#43211e; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--font);
  padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:1.1rem;font-weight:800}
.pill{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.78rem;
  padding:5px 10px;border-radius:99px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-block-end:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-width:0}
.tile .l{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:1.05rem;font-weight:800;overflow-wrap:anywhere}
.inc{color:var(--inc)} .exp{color:var(--exp)} .sav{color:var(--sav)}
.left{margin-block-start:12px;padding-block-start:12px;border-top:1px dashed var(--line)}

label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{
  width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font-weight:600}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.amt{font-size:1.6rem;font-weight:800;min-height:56px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:10px 4px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg input:focus-visible+label{outline:3px solid var(--accent)}
.seg input[value=Income]:checked+label{color:var(--inc)}
.seg input[value=Expense]:checked+label{color:var(--exp)}
.seg input[value=Savings]:checked+label{color:var(--sav)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}

.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.block{width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;background:var(--surface)}
td.cat{white-space:normal;min-width:7.5em}

.bar{height:6px;border-radius:4px;background:var(--bg);margin-block-start:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.dl{display:inline-block;margin-block-start:3px;font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.dl.good{background:var(--good-bg);color:var(--good)}
.dl.bad{background:var(--bad-bg);color:var(--bad)}
.dl.na{background:var(--bg);color:var(--muted)}

.tx{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .m{min-width:0}
.tx .t{font-weight:700;overflow-wrap:anywhere}
.tx .a{font-weight:800;text-align:right;white-space:nowrap}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-weight:600;font-size:.88rem}
.chip button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;width:26px;height:26px;border-radius:50%;cursor:pointer}
.chip button:hover{background:var(--line)}

.empty{text-align:center;padding:26px 8px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-block-end:4px}

nav{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:transparent;padding:8px 2px;border-radius:10px;font-weight:700;font-size:.74rem;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.88rem;z-index:20;
  max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.chartbox{overflow-x:auto}
.chartbox svg{display:block}
.legend{display:flex;gap:14px;font-size:.8rem;font-weight:700;margin-block-end:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;background:currentColor}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Income &amp; Expense Tracker</h1>
    <span class="pill" id="curpill"></span>
  </header>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var KEY='ie-tracker-v1';
var DEFAULT={
  tx:[],
  cats:{
    Income:['Paycheck','Accounting Services','Commission','Family support','Other income'],
    Expense:['Mortgage - VIA CC','Electric','Water','Internet','Laptop','Loan to Joint','Grocery','Allowance','Credit card','Tithes','Fare to Casas','Tiktok Paylater','Dates','Treats (Food)','Abono sa House','Pasalubong','Personal Things','Gifts/Celebration - Fam','Loan to Russel'],
    Savings:['Emergency Fund','Investments','MP2','Joint','Xmas TV','Travel (Baguio/Bohol)']
  },
  paydays:[15,30],
  shift:true
};
var memoryOnly=null;
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.tx&&o.cats)return o;}}catch(e){}
  return memoryOnly||JSON.parse(JSON.stringify(DEFAULT));
}
var S=load();
function save(){
  memoryOnly=S;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save on this browser. Download a backup in Settings.');}
}

/* ---------- helpers ---------- */
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function fdate(s,withYear){var d=parse(s);return MON[d.getMonth()]+' '+d.getDate()+(withYear===false?'':', '+d.getFullYear());}
function num(n){return n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money(n){return '₱'+num(n);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}

/* ---------- cut-off periods ----------
   Payday = the cut-off date (e.g. 15th, 30th; end of month if shorter), moved back
   to Friday when it falls on a weekend. A period runs from one payday up to the day
   before the next payday. */
function paydayOf(y,m,day){
  var last=new Date(y,m+1,0).getDate();
  var nominal=new Date(y,m,Math.min(day,last));
  var p=new Date(nominal);
  if(S.shift){var w=p.getDay();if(w===6)p=addDays(p,-1);else if(w===0)p=addDays(p,-2);}
  return {nominal:nominal,start:p};
}
function paydaysAround(y,m){
  var out=[];
  for(var k=-1;k<=1;k++){
    var dt=new Date(y,m+k,1);
    S.paydays.forEach(function(d){out.push(paydayOf(dt.getFullYear(),dt.getMonth(),d));});
  }
  out.sort(function(a,b){return a.start-b.start;});
  return out;
}
function periodOf(dateStr){
  var d=parse(dateStr),list=paydaysAround(d.getFullYear(),d.getMonth()),idx=0;
  for(var i=0;i<list.length;i++){if(list[i].start<=d)idx=i;}
  var p=list[idx],next=list[idx+1]||list[idx];
  var start=iso(p.start),end=iso(addDays(next.start,-1)),key=iso(p.nominal);
  return {key:key,start:start,end:end,label:fdate(key),range:fdate(start,false)+' – '+fdate(end)};
}
function todayISO(){return iso(new Date());}
function curPeriod(){return periodOf(todayISO());}

function blank(p){return {p:p,income:0,expense:0,savings:0,cat:{Income:{},Expense:{},Savings:{}},tx:[]};}
function aggAll(){
  var m={};
  S.tx.forEach(function(t){
    var p=periodOf(t.date),a=m[p.key]||(m[p.key]=blank(p));
    a[t.type.toLowerCase()]+=t.amt;
    a.cat[t.type][t.cat]=(a.cat[t.type][t.cat]||0)+t.amt;
    a.tx.push(t);
  });
  return m;
}
function periodList(m){
  var cur=curPeriod(),ps=Object.keys(m).map(function(k){return m[k].p;});
  ps.push(cur);
  ps.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0;});
  var last=ps[ps.length-1],p=ps[0],out=[],g=0;
  while(g++<400){
    out.push(p);
    if(p.start>=last.start)break;
    p=periodOf(iso(addDays(parse(p.end),1)));
  }
  return out;
}
function getAgg(m,p){return m[p.key]||blank(p);}

/* ---------- state ---------- */
var tab='add',reportKey=null,logKey='all',pendingDel=null,pendingWipe=false,addType='Expense';

/* ---------- delta chips ---------- */
function chip(cur,prev,upGood){
  if(prev==null)return '<span class="dl na">first</span>';
  var d=cur-prev;
  if(Math.abs(d)<0.005)return '<span class="dl na">no change</span>';
  var up=d>0,good=(up===upGood);
  var pct=prev?' ('+(up?'+':'−')+Math.abs(d/prev*100).toFixed(0)+'%)':'';
  return '<span class="dl '+(good?'good':'bad')+'">'+(up?'▲':'▼')+' '+num(Math.abs(d))+pct+'</span>';
}
function deltaText(cur,prev){
  if(prev==null)return 'first';
  var d=cur-prev;
  if(Math.abs(d)<0.005)return 'no change';
  return (d>0?'+':'-')+num(Math.abs(d))+(prev?' ('+(d>0?'+':'-')+Math.abs(d/prev*100).toFixed(0)+'%)':'');
}

/* ---------- views ---------- */
var ICONS={
  add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  log:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  report:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>',
  compare:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>'
};
var TABS=[['add','Add'],['log','Entries'],['report','Report'],['compare','Compare'],['settings','Settings']];
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+ICONS[t[0]==='compare'?'compare':t[0]]+t[1]+'</button>';
  }).join('');
}
function catOptions(type){
  return S.cats[type].map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
}
function tiles(a){
  var left=a.income-a.expense-a.savings;
  return '<div class="tiles">'+
    '<div class="tile"><div class="l">Income</div><div class="v num inc">'+money(a.income)+'</div></div>'+
    '<div class="tile"><div class="l">Spent</div><div class="v num exp">'+money(a.expense)+'</div></div>'+
    '<div class="tile"><div class="l">Saved</div><div class="v num sav">'+money(a.savings)+'</div></div></div>'+
    '<div class="left row between"><span class="muted small" style="font-weight:700">'+(left<0?'Over by':'Left to assign')+'</span>'+
    '<strong class="num" style="color:var(--'+(left<0?'bad':'ink')+')">'+money(Math.abs(left))+'</strong></div>';
}

function viewAdd(){
  var m=aggAll(),cp=curPeriod(),a=getAgg(m,cp);
  var h='<div class="card"><div class="row between"><h3>This cut-off</h3><span class="small muted">'+esc(cp.range)+'</span></div>'+
    '<div style="height:10px"></div>'+tiles(a)+'</div>';
  h+='<form class="card stack" id="addform" autocomplete="off">'+
    '<h2>Add an entry</h2>'+
    '<div class="seg" role="radiogroup" aria-label="Entry type">'+
    ['Expense','Savings','Income'].map(function(t){
      return '<input type="radio" name="type" id="ty'+t+'" value="'+t+'"'+(addType===t?' checked':'')+'><label for="ty'+t+'">'+t+'</label>';
    }).join('')+'</div>'+
    '<label class="f">Amount (PHP)<input class="amt num" id="f_amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>'+
    '<div class="two"><label class="f">Category<select id="f_cat">'+catOptions(addType)+'</select></label>'+
    '<label class="f">Date<input type="date" id="f_date" value="'+todayISO()+'" required></label></div>'+
    '<label class="f">Note (optional)<input type="text" id="f_note" maxlength="80" placeholder="e.g. SM Supermarket"></label>'+
    '<button class="btn primary block" type="submit">Save entry</button></form>';
  if(!S.tx.length){
    h+='<div class="hint">New here? Add your first entry above, or <button class="btn sm" data-act="sample">load sample entries</button> to see how the report and comparison look. Samples can be removed in Settings.</div>';
  }
  return h;
}

function periodSelect(id,selKey,withAll){
  var m=aggAll(),list=periodList(m).slice().reverse();
  var o=withAll?'<option value="all"'+(selKey==='all'?' selected':'')+'>All cut-offs</option>':'';
  o+=list.map(function(p){return '<option value="'+p.key+'"'+(p.key===selKey?' selected':'')+'>'+esc(p.label)+' ('+esc(p.range)+')</option>';}).join('');
  return '<select id="'+id+'" aria-label="Cut-off">'+o+'</select>';
}

function viewLog(){
  var m=aggAll(),rows=S.tx.slice();
  if(logKey!=='all')rows=rows.filter(function(t){return periodOf(t.date).key===logKey;});
  rows.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});
  var h='<div class="card stack"><h2>Entries</h2>'+periodSelect('logsel',logKey,true)+'</div>';
  if(!rows.length){
    return h+'<div class="card empty"><strong>No entries here yet</strong>Use the Add tab to record income, spending or savings.</div>';
  }
  h+='<div class="card">'+rows.map(function(t){
    var cls=t.type==='Income'?'inc':t.type==='Savings'?'sav':'exp',sign=t.type==='Income'?'+':'−';
    var del=pendingDel===t.id
      ?'<button class="btn sm danger" data-act="delyes" data-id="'+t.id+'">Tap to delete</button>'
      :'<button class="btn sm" data-act="del" data-id="'+t.id+'" aria-label="Delete entry">Delete</button>';
    return '<div class="tx"><div class="m"><div class="t">'+esc(t.cat)+(t.s?' <span class="muted small">(sample)</span>':'')+'</div>'+
      '<div class="small muted">'+fdate(t.date)+' · '+t.type+(t.note?' · '+esc(t.note):'')+'</div></div>'+
      '<div class="row" style="flex-wrap:nowrap"><div class="a num '+cls+'">'+sign+money(t.amt)+'</div>'+del+'</div></div>';
  }).join('')+'</div>';
  return h;
}

function catRows(a,type,total){
  var obj=a.cat[type],keys=Object.keys(obj).sort(function(x,y){return obj[y]-obj[x];});
  if(!keys.length)return '<tr><td colspan="3" class="muted">Nothing recorded</td></tr>';
  var col=type==='Expense'?'var(--exp)':type==='Savings'?'var(--sav)':'var(--inc)';
  return keys.map(function(k){
    var pc=total?obj[k]/total*100:0;
    return '<tr><td class="cat">'+esc(k)+'<div class="bar"><i style="width:'+pc.toFixed(1)+'%;background:'+col+'"></i></div></td>'+
      '<td class="num">'+num(obj[k])+'</td><td class="num muted">'+pc.toFixed(0)+'%</td></tr>';
  }).join('');
}
function currentReport(){
  var m=aggAll(),list=periodList(m);
  var p=list.filter(function(x){return x.key===reportKey;})[0]||curPeriod();
  reportKey=p.key;
  return getAgg(m,p);
}
function viewReport(){
  var a=currentReport();
  var h='<div class="card stack"><h2>Report per cut-off</h2>'+periodSelect('repsel',reportKey,false)+
    '<div class="small muted">Covers '+esc(a.p.range)+'</div></div>';
  h+='<div class="card">'+tiles(a)+'</div>';
  [['Income',a.income],['Expense',a.expense],['Savings',a.savings]].forEach(function(x){
    h+='<div class="card"><h3>'+(x[0]==='Expense'?'Expenses':x[0])+' by category</h3><div class="scroll"><table><tbody>'+
      catRows(a,x[0],x[1])+'</tbody><tfoot><tr><td>Total</td><td class="num">'+num(x[1])+'</td><td></td></tr></tfoot></table></div></div>';
  });
  h+='<div class="card stack"><h3>Download this report</h3><div class="btns">'+
    '<button class="btn primary" data-act="pdf-report">PDF</button>'+
    '<button class="btn" data-act="csv-report">Spreadsheet (CSV)</button></div></div>';
  return h;
}

function chartSVG(rows){
  var W=Math.max(320,rows.length*74),H=190,top=14,bot=34,ph=H-top-bot;
  var max=0;rows.forEach(function(r){max=Math.max(max,r.expense,r.savings);});
  if(!max)max=1;
  var gw=W/rows.length,bw=Math.min(22,gw/3),s='';
  for(var g=0;g<=2;g++){
    var y=top+ph-ph*g/2;
    s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
  }
  rows.forEach(function(r,i){
    var cx=gw*i+gw/2,he=ph*r.expense/max,hs=ph*r.savings/max;
    s+='<rect x="'+(cx-bw-1)+'" y="'+(top+ph-he)+'" width="'+bw+'" height="'+he+'" rx="3" fill="var(--exp)"/>';
    s+='<rect x="'+(cx+1)+'" y="'+(top+ph-hs)+'" width="'+bw+'" height="'+hs+'" rx="3" fill="var(--sav)"/>';
    s+='<text x="'+cx+'" y="'+(H-14)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">'+fdate(r.p.key,false)+'</text>';
  });
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending and savings per cut-off">'+s+'</svg>';
}
function summaryRows(){
  var m=aggAll(),list=periodList(m);
  return list.map(function(p){return getAgg(m,p);});
}
function viewCompare(){
  var rows=summaryRows();
  if(!S.tx.length){
    return '<div class="card empty"><strong>Nothing to compare yet</strong>Once you have entries in two or more cut-offs, this page shows how spending and savings went up or down.<div style="height:12px"></div><button class="btn" data-act="sample">Load sample entries</button></div>';
  }
  var n=rows.length,last=rows[n-1],prev=n>1?rows[n-2]:null;
  var h='<div class="card stack"><h2>All cut-offs compared</h2>';
  if(prev){
    h+='<div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="l">Spent, '+esc(last.p.label)+'</div><div class="v num exp">'+money(last.expense)+'</div>'+chip(last.expense,prev.expense,false)+'</div>'+
       '<div class="tile"><div class="l">Saved, '+esc(last.p.label)+'</div><div class="v num sav">'+money(last.savings)+'</div>'+chip(last.savings,prev.savings,true)+'</div></div>'+
       '<div class="small muted">Change against the cut-off before it ('+esc(prev.p.label)+'). Green is good: less spent or more saved.</div>';
  }else h+='<div class="small muted">Only one cut-off so far. Changes show once there is a second one.</div>';
  h+='</div>';
  h+='<div class="card"><div class="legend"><span style="color:var(--exp)">Spent</span><span style="color:var(--sav)">Saved</span></div><div class="chartbox">'+chartSVG(rows)+'</div></div>';
  var body=rows.map(function(r,i){var pv=i?rows[i-1]:null;return {r:r,pv:pv};}).reverse().map(function(x){
    var r=x.r,pv=x.pv;
    return '<tr><td><strong>'+esc(r.p.label)+'</strong><div class="small muted">'+esc(r.p.range)+'</div></td>'+
      '<td class="num inc">'+num(r.income)+'</td>'+
      '<td class="num">'+num(r.expense)+'<br>'+chip(r.expense,pv?pv.expense:null,false)+'</td>'+
      '<td class="num">'+num(r.savings)+'<br>'+chip(r.savings,pv?pv.savings:null,true)+'</td></tr>';
  }).join('');
  h+='<div class="card"><h3>Per cut-off</h3><div class="scroll"><table class="sticky1"><thead><tr><th>Cut-off</th><th>Income</th><th>Spent</th><th>Saved</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  ['Expense','Savings'].forEach(function(type){
    var names={};S.cats[type].forEach(function(c){names[c]=1;});
    rows.forEach(function(r){Object.keys(r.cat[type]).forEach(function(c){names[c]=1;});});
    var cs=Object.keys(names).filter(function(c){return rows.some(function(r){return r.cat[type][c];});});
    if(!cs.length)return;
    var head='<th>Category</th>'+rows.map(function(r){return '<th>'+fdate(r.p.key,false)+'</th>';}).join('');
    var tb=cs.map(function(c){
      return '<tr><td class="cat">'+esc(c)+'</td>'+rows.map(function(r){var v=r.cat[type][c]||0;return '<td class="num'+(v?'':' muted')+'">'+(v?num(v):'–')+'</td>';}).join('')+'</tr>';
    }).join('');
    h+='<div class="card"><h3>'+(type==='Expense'?'Spending':'Savings')+' by category</h3><div class="scroll"><table class="sticky1"><thead><tr>'+head+'</tr></thead><tbody>'+tb+'</tbody></table></div></div>';
  });
  h+='<div class="card stack"><h3>Download the comparison</h3><div class="btns"><button class="btn primary" data-act="pdf-summary">PDF</button><button class="btn" data-act="csv-summary">Spreadsheet (CSV)</button></div></div>';
  return h;
}

function viewSettings(){
  var h='';
  ['Expense','Savings','Income'].forEach(function(type){
    h+='<div class="card stack"><h3>'+(type==='Expense'?'Expense':type)+' categories</h3><div class="chips">'+
      S.cats[type].map(function(c,i){return '<span class="chip">'+esc(c)+'<button data-act="rmcat" data-type="'+type+'" data-i="'+i+'" aria-label="Remove '+esc(c)+'">×</button></span>';}).join('')+'</div>'+
      '<div class="row" style="flex-wrap:nowrap"><input type="text" id="nc'+type+'" maxlength="40" placeholder="New category" aria-label="New '+type+' category"><button class="btn" data-act="addcat" data-type="'+type+'">Add</button></div></div>';
  });
  h+='<div class="card stack"><h3>Cut-off dates</h3>'+
    '<div class="two"><label class="f">First payday (day)<input type="number" id="pd1" min="1" max="31" value="'+S.paydays[0]+'"></label>'+
    '<label class="f">Second payday (day)<input type="number" id="pd2" min="1" max="31" value="'+S.paydays[1]+'"></label></div>'+
    '<label class="row" style="flex-wrap:nowrap;font-weight:600"><input type="checkbox" id="shift" style="width:22px;height:22px"'+(S.shift?' checked':'')+'> If payday falls on a weekend, use the Friday before</label>'+
    '<div class="small muted">A cut-off runs from one payday to the day before the next. Months shorter than the chosen day use their last day.</div>'+
    '<button class="btn" data-act="savecut">Save cut-off dates</button></div>';
  h+='<div class="card stack"><h3>Your data</h3><div class="small muted">Everything is saved only in this phone’s browser. Nothing is uploaded and no account is used. Download a backup before changing phones or clearing browser data.</div>'+
    '<div class="btns"><button class="btn primary" data-act="export">Download backup</button><label class="btn" style="text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center">Restore backup<input type="file" id="imp" accept=".json,application/json" hidden></label></div>';
  if(S.tx.some(function(t){return t.s;}))h+='<button class="btn block" data-act="unsample">Remove sample entries</button>';
  h+=pendingWipe
    ?'<button class="btn danger block" data-act="wipeyes">Tap again to erase all entries</button>'
    :'<button class="btn danger block" data-act="wipe">Erase all entries</button>';
  h+='</div>';
  return h;
}

function render(){
  var v=document.getElementById('view');
  v.innerHTML=({add:viewAdd,log:viewLog,report:viewReport,compare:viewCompare,settings:viewSettings})[tab]();
  renderNav();
  document.getElementById('curpill').textContent='Cut-off '+fdate(curPeriod().key,false);
}

/* ---------- exports ---------- */
function download(blob,name){
  var a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
  toast('Saved '+name);
}
function csvCell(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csvBlob(rows){return new Blob(['﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n')],{type:'text/csv;charset=utf-8'});}
function pdfEsc(s){return String(s).replace(/₱/g,'PHP ').replace(/[–—−]/g,'-').replace(/[^\x20-\x7E]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function pdfBlob(lines){
  var W=595,H=842,M=40,LH=12,per=Math.floor((H-2*M)/LH),pages=[],i;
  for(i=0;i<lines.length;i+=per)pages.push(lines.slice(i,i+per));
  if(!pages.length)pages.push([]);
  var objs=[null];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+pages.map(function(_,k){return (5+k*2)+' 0 R';}).join(' ')+'] /Count '+pages.length+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach(function(pl,k){
    var pn=5+k*2,cn=pn+1,s='BT\n',y=H-M-9;
    pl.forEach(function(l){s+='/'+(l.b?'F2':'F1')+' 9 Tf 1 0 0 1 '+M+' '+y+' Tm ('+pdfEsc(l.t)+') Tj\n';y-=LH;});
    s+='ET';
    objs[pn]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cn+' 0 R >>';
    objs[cn]='<< /Length '+s.length+' >>\nstream\n'+s+'\nendstream';
  });
  var out='%PDF-1.4\n',offs=[];
  for(i=1;i<objs.length;i++){offs[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  var xr=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var u=new Uint8Array(out.length);
  for(i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}
function L(t,b){return {t:t,b:!!b};}
function rowL(label,val,w){w=w||72;return label.slice(0,w-16).padEnd(w-16)+num(val).padStart(16);}
function slug(s){return s.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function reportLines(a){
  var ls=[L('INCOME AND EXPENSE REPORT',1),L('Cut-off: '+a.p.label+'   Period: '+a.p.range),L('Generated: '+fdate(todayISO())),L(''),
    L('SUMMARY',1),L(rowL('Income',a.income)),L(rowL('Expenses',a.expense)),L(rowL('Savings',a.savings)),
    L(rowL(a.income-a.expense-a.savings<0?'Over by':'Left to assign',Math.abs(a.income-a.expense-a.savings)),1),L('')];
  [['Income','INCOME BY CATEGORY',a.income],['Expense','EXPENSES BY CATEGORY',a.expense],['Savings','SAVINGS BY CATEGORY',a.savings]].forEach(function(x){
    ls.push(L(x[1],1));
    var o=a.cat[x[0]],ks=Object.keys(o).sort(function(p,q){return o[q]-o[p];});
    if(!ks.length)ls.push(L('  (none)'));
    ks.forEach(function(k){ls.push(L(rowL('  '+k,o[k],62)+(x[2]?(o[k]/x[2]*100).toFixed(0).padStart(5)+'%':'')));});
    ls.push(L(rowL('  Total',x[2],62),1));ls.push(L(''));
  });
  ls.push(L('ENTRIES',1));
  a.tx.slice().sort(function(p,q){return p.date<q.date?-1:1;}).forEach(function(t){
    ls.push(L((t.date+' '+t.type.padEnd(8)+' '+t.cat.slice(0,24).padEnd(24)+' '+(t.type==='Income'?'+':'-')+num(t.amt).padStart(13)+(t.note?'  '+t.note.slice(0,10):''))));
  });
  if(!a.tx.length)ls.push(L('  (no entries)'));
  return ls;
}
function summaryLines(rows){
  var ls=[L('INCOME AND EXPENSE - ALL CUT-OFFS',1),L('Generated: '+fdate(todayISO())),L(''),
    L('Cut-off'.padEnd(14)+'Income'.padStart(14)+'Spent'.padStart(14)+'Saved'.padStart(14)+'Spent chg'.padStart(14)+'Saved chg'.padStart(14),1)];
  var short=function(c,p){if(p==null)return '-';var d=c-p;if(Math.abs(d)<0.005)return '0.00';return (d>0?'+':'-')+num(Math.abs(d));};
  rows.forEach(function(r,i){
    var p=i?rows[i-1]:null;
    ls.push(L(r.p.label.padEnd(14)+num(r.income).padStart(14)+num(r.expense).padStart(14)+num(r.savings).padStart(14)+short(r.expense,p&&p.expense).padStart(14)+short(r.savings,p&&p.savings).padStart(14)));
  });
  ls.push(L(''));
  ls.push(L('Spent chg / Saved chg = change against the previous cut-off.'));
  ls.push(L('Less spent and more saved is an improvement.'));
  ['Expense','Savings'].forEach(function(type){
    var names={};rows.forEach(function(r){Object.keys(r.cat[type]).forEach(function(c){names[c]=1;});});
    var cs=Object.keys(names);if(!cs.length)return;
    ls.push(L(''));ls.push(L((type==='Expense'?'SPENDING':'SAVINGS')+' BY CATEGORY',1));
    var chunks=[];for(var i=0;i<rows.length;i+=4)chunks.push(rows.slice(i,i+4));
    chunks.forEach(function(ch){
      ls.push(L('Category'.padEnd(26)+ch.map(function(r){return r.p.label.slice(0,11).padStart(13);}).join(''),1));
      cs.forEach(function(c){ls.push(L(c.slice(0,25).padEnd(26)+ch.map(function(r){var v=r.cat[type][c];return (v?num(v):'-').padStart(13);}).join('')));});
      ls.push(L(''));
    });
  });
  return ls;
}
function reportCSV(a){
  var rows=[['Cut-off',a.p.label,'Period',a.p.range],[],['Date','Type','Category','Amount','Note']];
  a.tx.slice().sort(function(p,q){return p.date<q.date?-1:1;}).forEach(function(t){rows.push([t.date,t.type,t.cat,t.amt.toFixed(2),t.note||'']);});
  rows.push([],['Income','','',a.income.toFixed(2)],['Expenses','','',a.expense.toFixed(2)],['Savings','','',a.savings.toFixed(2)]);
  return csvBlob(rows);
}
function summaryCSV(rows){
  var out=[['Cut-off','Period','Income','Spent','Saved','Spent change','Saved change']];
  rows.forEach(function(r,i){var p=i?rows[i-1]:null;
    out.push([r.p.label,r.p.range,r.income.toFixed(2),r.expense.toFixed(2),r.savings.toFixed(2),p?(r.expense-p.expense).toFixed(2):'',p?(r.savings-p.savings).toFixed(2):'']);});
  ['Expense','Savings'].forEach(function(type){
    var names={};rows.forEach(function(r){Object.keys(r.cat[type]).forEach(function(c){names[c]=1;});});
    var cs=Object.keys(names);if(!cs.length)return;
    out.push([],[type==='Expense'?'Spending by category':'Savings by category'].concat(rows.map(function(r){return r.p.label;})));
    cs.forEach(function(c){out.push([c].concat(rows.map(function(r){return (r.cat[type][c]||0).toFixed(2);})));});
  });
  return csvBlob(out);
}

/* ---------- sample data ---------- */
function loadSample(){
  var cp=curPeriod(),ps=[cp],i;
  for(i=0;i<3;i++)ps.unshift(periodOf(iso(addDays(parse(ps[0].start),-1))));
  var spend=[['Grocery',2400],['Electric',1850],['Allowance',3000],['Tithes',1000],['Treats (Food)',900],['Credit card',5200]];
  ps.forEach(function(p,k){
    var d0=parse(p.start);
    S.tx.push({id:uid(),s:1,date:p.start,type:'Income',cat:'Paycheck',amt:18000+k*500,note:'Sample'});
    spend.forEach(function(sp,j){
      var f=[1,0.9,1.15,1.05][(k+j)%4];
      S.tx.push({id:uid(),s:1,date:iso(addDays(d0,Math.min(j+1,10))),type:'Expense',cat:sp[0],amt:Math.round(sp[1]*f),note:''});
    });
    S.tx.push({id:uid(),s:1,date:iso(addDays(d0,2)),type:'Savings',cat:'Emergency Fund',amt:2000-k*300+(k%2)*600,note:''});
    S.tx.push({id:uid(),s:1,date:iso(addDays(d0,3)),type:'Savings',cat:'MP2',amt:1000,note:''});
  });
  save();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),ty=b.getAttribute('data-type'),id=b.getAttribute('data-id');
  if(act!=='del')pendingDel=null;
  if(act!=='wipe')pendingWipe=false;
  if(act==='tab'){tab=b.getAttribute('data-tab');render();window.scrollTo(0,0);return;}
  if(act==='del'){pendingDel=id;render();return;}
  if(act==='delyes'){S.tx=S.tx.filter(function(t){return t.id!==id;});pendingDel=null;save();render();toast('Entry deleted');return;}
  if(act==='sample'){loadSample();render();toast('Sample entries added');return;}
  if(act==='unsample'){S.tx=S.tx.filter(function(t){return !t.s;});save();render();toast('Sample entries removed');return;}
  if(act==='wipe'){pendingWipe=true;render();return;}
  if(act==='wipeyes'){S.tx=[];pendingWipe=false;save();render();toast('All entries erased');return;}
  if(act==='addcat'){
    var inp=document.getElementById('nc'+ty),v=inp.value.trim();
    if(!v)return;
    if(S.cats[ty].some(function(c){return c.toLowerCase()===v.toLowerCase();})){toast('That category already exists');return;}
    S.cats[ty].push(v);save();render();toast('Category added');return;
  }
  if(act==='rmcat'){var removed=S.cats[ty].splice(+b.getAttribute('data-i'),1);save();render();toast('Removed '+removed[0]+'. Past entries are kept.');return;}
  if(act==='savecut'){
    var d1=parseInt(document.getElementById('pd1').value,10),d2=parseInt(document.getElementById('pd2').value,10);
    if(!(d1>=1&&d1<=31&&d2>=1&&d2<=31)||d1===d2){toast('Enter two different days from 1 to 31');return;}
    S.paydays=[d1,d2].sort(function(a,b){return a-b;});S.shift=document.getElementById('shift').checked;
    save();render();toast('Cut-off dates saved');return;
  }
  if(act==='export'){download(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),'tracker-backup-'+todayISO()+'.json');return;}
  var a;
  if(act==='pdf-report'){a=currentReport();download(pdfBlob(reportLines(a)),'Report-'+slug(a.p.label)+'.pdf');return;}
  if(act==='csv-report'){a=currentReport();download(reportCSV(a),'Report-'+slug(a.p.label)+'.csv');return;}
  if(act==='pdf-summary'){download(pdfBlob(summaryLines(summaryRows())),'All-cutoffs-comparison.pdf');return;}
  if(act==='csv-summary'){download(summaryCSV(summaryRows()),'All-cutoffs-comparison.csv');return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='type'){addType=t.value;document.getElementById('f_cat').innerHTML=catOptions(addType);return;}
  if(t.id==='logsel'){logKey=t.value;pendingDel=null;render();return;}
  if(t.id==='repsel'){reportKey=t.value;render();return;}
  if(t.id==='imp'&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        if(!o||!Array.isArray(o.tx)||!o.cats||!o.cats.Expense)throw 0;
        S=o;if(!S.paydays)S.paydays=[15,30];if(S.shift==null)S.shift=true;
        save();render();toast('Backup restored');
      }catch(x){toast('That file is not a tracker backup');}
    };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='addform')return;
  e.preventDefault();
  var amt=parseFloat(document.getElementById('f_amt').value),date=document.getElementById('f_date').value,cat=document.getElementById('f_cat').value;
  if(!(amt>0)){toast('Enter an amount above zero');return;}
  if(!date||!cat){toast('Choose a date and category');return;}
  S.tx.push({id:uid(),date:date,type:addType,cat:cat,amt:Math.round(amt*100)/100,note:document.getElementById('f_note').value.trim()});
  save();render();toast('Saved '+money(amt)+' – '+cat);
});

render();
})();
